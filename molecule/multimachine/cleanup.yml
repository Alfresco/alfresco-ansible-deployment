---
- name: Default cleanup
  import_playbook: ../default/cleanup.yml

- name: Multimachine cleanup
  hosts: localhost
  gather_facts: false
  vars:
    project_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: Destroy Shared contentstore
      community.aws.efs:
        state: absent
        name: molecule-{{ lookup('ansible.builtin.env', 'BUILD_NUMBER') }}
      when: molecule_yml.platforms | selectattr('name', 'in', groups.repository) | length > 1
      register: contentstore

    - name: Reset repo host_vars files
      ansible.builtin.blockinfile:
        state: absent
        marker: >-
          # {mark} CS_STORAGE VARS
        path: host_vars/{{ item }}.yml
      loop: "{{ molecule_yml.platforms | selectattr('name', 'in', groups.repository) | map(attribute='name') }}"

- name: Cleanup external OpenSearch domain and instance profile
  hosts: localhost
  gather_facts: false
  vars:
    es_iam_auth: "{{ lookup('ansible.builtin.env', 'MOLECULE_ES_AUTH') == 'aws-iam' }}"
    it_platform: "{{ lookup('ansible.builtin.env', 'MOLECULE_IT_PLATFORM') }}"
    repo_branch: "{{ lookup('ansible.builtin.env', 'BRANCH_NAME') }}"
    build: "{{ lookup('ansible.builtin.env', 'BUILD_NUMBER') }}"
    domain_name: >-
      {{ ['molecule', it_platform, build, repo_branch]
      | join('-')
      | ansible.builtin.regex_replace('[^a-zA-Z0-9]', build[-1])
      | lower
      | truncate(28, True, '', 0) }}
    resource_suffix: >-
      {{ [it_platform, build, repo_branch]
      | join('-')
      | ansible.builtin.regex_replace('[^a-zA-Z0-9]', '-')
      | lower
      | truncate(40, True, '', 0) }}
    opensearch_role_name: "molecule-{{ resource_suffix }}-opensearch"
    ec2_tag_names:
      - "molecule_{{ it_platform }}_repo_{{ repo_branch }}_{{ build }}"
      - "molecule_{{ it_platform }}_es_{{ repo_branch }}_{{ build }}"
  tasks:
    - name: Tear down the SigV4 OpenSearch domain and instance profile
      when: es_iam_auth | bool
      block:
        - name: Destroy OpenSearch domain {{ domain_name }}
          community.aws.opensearch:
            domain_name: "{{ domain_name }}"
            state: absent
            wait_timeout: 1200
            wait: true

        - name: Gather repository and search EC2 instances
          amazon.aws.ec2_instance_info:
            filters:
              "tag:Name": "{{ ec2_tag_names }}"
          register: sigv4_ec2

        - name: Disassociate the instance profile from repository and search hosts
          ansible.builtin.shell: |
            set -o pipefail
            assoc=$(aws ec2 describe-iam-instance-profile-associations \
              --filters "Name=instance-id,Values={{ item }}" \
              --query "IamInstanceProfileAssociations[].AssociationId" --output text)
            for a in $assoc; do
              aws ec2 disassociate-iam-instance-profile --association-id "$a"
            done
          args:
            executable: /bin/bash
          loop: "{{ sigv4_ec2.instances | map(attribute='instance_id') | list }}"
          changed_when: true
          failed_when: false

        - name: Delete the es:ESHttp* inline policy
          amazon.aws.iam_policy:
            iam_type: role
            iam_name: "{{ opensearch_role_name }}"
            policy_name: "{{ opensearch_role_name }}-eshttp"
            state: absent
          failed_when: false

        - name: Delete the IAM role and its instance profile
          amazon.aws.iam_role:
            name: "{{ opensearch_role_name }}"
            state: absent
            delete_instance_profile: true
          failed_when: false

- name: Cleanup external activemq
  hosts: localhost
  gather_facts: false
  vars:
    broker_name: molecule-{{ lookup('ansible.builtin.env', 'BRANCH_NAME') }}-{{ lookup('ansible.builtin.env', 'BUILD_NUMBER') }}
  tasks:

    - name: Grab activemq broker id
      ansible.builtin.shell: |
        aws mq describe-broker --broker-id {{ broker_name }} || true
      register: describe_broker_output

    - name: Set broker-id
      ansible.builtin.set_fact:
        broker_id: "{{ (describe_broker_output.stdout | from_json).BrokerId }}"
      when: describe_broker_output.stdout | length > 0

    - name: Request mq broker destroy
      ansible.builtin.command: |
        aws mq delete-broker --broker-id {{ broker_id }}
      when: broker_id is defined

    - name: Wait for destroy mq broker
      ansible.builtin.shell: |
        aws mq describe-broker --broker-id {{ broker_id }} || true
      when: broker_id is defined
      register: wait_describe_broker_output
      until: wait_describe_broker_output.stderr.find("NotFoundException") != -1
      retries: 20
      delay: 30

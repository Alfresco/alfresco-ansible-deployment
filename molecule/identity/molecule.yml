---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: identity-instance
    image: $MOLECULE_ROLE_IMAGE
    dockerfile: ../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    groups:
      - database
      - activemq
      - repository
      - trusted_resource_consumers
      - adw
      - acc
      - identity
      - nginx
    published_ports:
      - 0.0.0.0:80:80/tcp

provisioner:
  name: ansible
  ansible_args: []
  config_options:
    defaults:
      pipelining: True
  inventory:
    links:
      group_vars: ../../playbooks/group_vars
      host_vars: host_vars
verifier:
  name: ansible

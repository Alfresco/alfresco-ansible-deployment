- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Check expected cic services are present
      ansible.builtin.assert:
        that:
          - "'alfresco-cic-connector-live-ingester.service' in ansible_facts.services"
          - ansible_facts.services['alfresco-cic-connector-live-ingester.service'].state == 'running'
          - "'alfresco-cic-connector-nucleus-sync.service' in ansible_facts.services"
          - ansible_facts.services['alfresco-cic-connector-nucleus-sync.service'].state == 'running'
          - "'alfresco-cic-connector-bulk-ingester.service' in ansible_facts.services"
          - ansible_facts.services['alfresco-cic-connector-bulk-ingester.service'].state != 'running'

- name: Import the default verify playbook
  ansible.builtin.import_playbook: ../default/verify.yml

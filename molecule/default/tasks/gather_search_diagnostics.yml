---
# Best-effort search/indexing diagnostics for debugging flaky DTAS runs.
# Every task is non-fatal (failed_when: false) so it never masks the real
# test result, and no-ops cleanly on scenarios without a given service.
# Pass diag_label to distinguish the capture point in the CI log.
- name: "Diag [{{ diag_label | default('search') }}] reindex job outcome"
  become: true
  ansible.builtin.shell: |
    echo "state=$(systemctl is-active elasticsearch-connector-reindex 2>/dev/null)"
    journalctl -u elasticsearch-connector-reindex --no-pager 2>/dev/null \
      | grep -iE 'reindexByIds.*(COMPLETED|FAILED|STARTED)|updated nodes with Path|failed Path update|ERROR|Exception' \
      | tail -n 20
  register: diag_reindex
  changed_when: false
  failed_when: false

- name: "Diag [{{ diag_label | default('search') }}] reindex"
  ansible.builtin.debug:
    var: diag_reindex.stdout_lines

- name: "Diag [{{ diag_label | default('search') }}] live connector health + errors"
  become: true
  ansible.builtin.shell: |
    echo "state=$(systemctl is-active elasticsearch-connector 2>/dev/null)"
    echo "activemq_connect_events=$(journalctl -u elasticsearch-connector --no-pager 2>/dev/null | grep -c 'Successfully connected to tcp')"
    journalctl -u elasticsearch-connector --no-pager 2>/dev/null \
      | grep -viE 'FailoverTransport|EndpointLinksResolver|TomcatWebServer|AbstractCamelContext|HikariDataSource' \
      | grep -iE 'WARN|ERROR|Exception|transform|path|content|refused|reset|denied|403|version_conflict' \
      | tail -n 40
  register: diag_connector
  changed_when: false
  failed_when: false

- name: "Diag [{{ diag_label | default('search') }}] live connector"
  ansible.builtin.debug:
    var: diag_connector.stdout_lines

- name: "Diag [{{ diag_label | default('search') }}] ActiveMQ restarts/blips"
  become: true
  ansible.builtin.shell: |
    echo "state=$(systemctl is-active activemq 2>/dev/null)"
    journalctl -u activemq --no-pager 2>/dev/null \
      | grep -iE 'Started|Stopped|Stopping|shutdown|error|refused|interrupt|OutOfMemory|Store limit|Usage Manager' \
      | tail -n 20
  register: diag_activemq
  changed_when: false
  failed_when: false

- name: "Diag [{{ diag_label | default('search') }}] ActiveMQ"
  ansible.builtin.debug:
    var: diag_activemq.stdout_lines

- name: "Diag [{{ diag_label | default('search') }}] transform engines"
  become: true
  ansible.builtin.shell: |
    for u in alfresco-transform-router alfresco-tengine-aio ats-shared-fs; do
      echo "== ${u} =="
      journalctl -u "${u}" --no-pager 2>/dev/null \
        | grep -iE 'WARN|ERROR|Exception|403|refused|mtls|ssl|handshake' | tail -n 10
    done
  register: diag_transform
  changed_when: false
  failed_when: false

- name: "Diag [{{ diag_label | default('search') }}] transform engines"
  ansible.builtin.debug:
    var: diag_transform.stdout_lines

- name: "Diag [{{ diag_label | default('search') }}] repository transform/index errors"
  become: true
  ansible.builtin.shell: |
    journalctl -u alfresco-content --no-pager 2>/dev/null \
      | grep -iE 'ContentTransform|TRANSFORM_HTTP|403|Forbidden|not be searchable|reindex|Exception' \
      | tail -n 20
  register: diag_repo
  changed_when: false
  failed_when: false

- name: "Diag [{{ diag_label | default('search') }}] repository"
  ansible.builtin.debug:
    var: diag_repo.stdout_lines

- name: "Diag [{{ diag_label | default('search') }}] Elasticsearch index counts"
  become: true
  ansible.builtin.shell: |
    unit=/etc/systemd/system/elasticsearch-connector.service
    envf=/etc/systemd/system/alfresco-batch-indexing.env
    creds="admin:admin"
    for f in "$unit" "$envf"; do
      if [ -f "$f" ]; then
        u=$(grep -oiE 'REST_USERNAME=[^ ]+' "$f" | head -1 | cut -d= -f2)
        p=$(grep -oiE 'REST_PASSWORD=[^ ]+' "$f" | head -1 | cut -d= -f2)
        [ -n "$u" ] && creds="${u}:${p}" && break
      fi
    done
    es=http://localhost:9200
    echo "index_health=$(curl -s -u "$creds" "${es}/_cluster/health/alfresco?pretty" 2>/dev/null | tr -d ' \n')"
    echo "total_docs=$(curl -s -u "$creds" "${es}/alfresco/_count" 2>/dev/null)"
    echo "docs_with_content=$(curl -s -u "$creds" "${es}/alfresco/_count" -H 'Content-Type: application/json' -d '{"query":{"exists":{"field":"cm%3Acontent"}}}' 2>/dev/null)"
  args:
    executable: /bin/bash
  register: diag_es
  changed_when: false
  failed_when: false

- name: "Diag [{{ diag_label | default('search') }}] Elasticsearch"
  ansible.builtin.debug:
    var: diag_es.stdout_lines

---
platforms:
  - name: activemq-instance
    image: $MOLECULE_ROLE_IMAGE
    dockerfile: ../../../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    groups:
      - repository
      - nginx
      - syncservice
      - database
      - transformers
      - sfs
      - trouter
      - search
      - adw
      - activemq
provisioner:
  name: ansible
  inventory:
    links:
      host_vars: host_vars
      group_vars: ../../../../playbooks/group_vars

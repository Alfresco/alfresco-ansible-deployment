---
platforms:
  - name: repository-instance
    image: $MOLECULE_ROLE_IMAGE
    dockerfile: ../../../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    groups:
      - repository
      - activemq
      - database
      - syncservice
      - sfs
      - search
      - nginx
      - adw
      - transformers
      - trusted_resource_consumers
provisioner:
  inventory:
    links:
      host_vars: host_vars

---
platforms:
  - name: sfs-instance
    image: $MOLECULE_ROLE_IMAGE
    dockerfile: ../../../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    groups:
      - transformers
provisioner:
  name: ansible
  ansible_args:
    - -e
    - "@../../../../vars/acs26.yml"
  inventory:
    links:
      host_vars: host_vars
      group_vars: ../../../../playbooks/group_vars

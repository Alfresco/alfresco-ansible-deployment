---
platforms:
  - name: syncservice-instance
    image: $MOLECULE_ROLE_IMAGE
    dockerfile: ../../../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    groups:
      - repository
      - trusted_resource_consumers
      - nginx
      - syncservice
      - database
      - activemq
provisioner:
  inventory:
    links:
      host_vars: host_vars
verifier:
  name: ansible

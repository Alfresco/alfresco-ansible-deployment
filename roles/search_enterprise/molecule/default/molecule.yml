---
platforms:
  - name: search-ent-instance
    image: $MOLECULE_ROLE_IMAGE
    dockerfile: ../../../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    groups:
      - activemq
      - sfs
      - transformers
      - indexers
provisioner:
  inventory:
    links:
      host_vars: host_vars
verifier:
  name: ansible

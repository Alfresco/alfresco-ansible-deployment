---
platforms:
  - name: tomcat-instance
    image: $MOLECULE_ROLE_IMAGE
    dockerfile: ../../../../tests/molecule/Dockerfile-noprivs.j2
    command: "/lib/systemd/systemd"
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
provisioner:
  name: ansible
  inventory:
    links:
      host_vars: host_vars
      group_vars: ../../../../playbooks/group_vars

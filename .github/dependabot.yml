version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "boto3"
      - dependency-name: "ansible-core"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "molecule"
        # molecule 26.8.0 is incompatible with the molecule-plugins ec2 driver
        versions:
          - "26.8.0"
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

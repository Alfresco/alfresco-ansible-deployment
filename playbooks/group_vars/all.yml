# REQUIRED: add at least the Share url
# The first entry will also be used to assume the base URL of this alfresco install
# For more information please have a look at the
# [security_doc](https://github.com/Alfresco/alfresco-ansible-deployment/blob/master/docs/SECURITY.md#specify-trustworthy-applications)
acs_play_known_urls: []
acs_play_major_version: 26

acs_play_default_java_version: 17.0.20+8

artifacts_repositories:
  enterprise:
    base_url: "https://artifacts.alfresco.com/nexus/content"
    repository: "groups/private"
    group_id: "org/alfresco"
  community:
    base_url: "https://artifacts.alfresco.com/nexus/content"
    repository: "groups/public"
    group_id: "org/alfresco"
  development:
    repository: "groups/internal"
nexus_repository:
  releases: >-
    {{ artifacts_repositories.community.base_url }}/{{ artifacts_repositories.community.repository }}/{{ artifacts_repositories.community.group_id }}
  enterprise_releases: >-
    {{ artifacts_repositories.enterprise.base_url }}/{{ artifacts_repositories.enterprise.repository }}/{{ artifacts_repositories.enterprise.group_id }}
  development_releases: >-
    {{ artifacts_repositories.enterprise.base_url }}/{{ artifacts_repositories.development.repository }}/{{ artifacts_repositories.enterprise.group_id }}

cloudsmith_repositories:
  enterprise:
    base_url: "https://artifacts.hyland.dev/basic"
    repository: "alfresco-private/maven"
    group_id: "org/alfresco"
  community:
    base_url: "https://artifacts.hyland.dev/basic"
    repository: "alfresco-public/maven"
    group_id: "org/alfresco"
  development:
    repository: "alfresco-internal/maven"
cloudsmith_repository:
  releases: >-
    {{ cloudsmith_repositories.community.base_url }}/{{ cloudsmith_repositories.community.repository }}/{{ cloudsmith_repositories.community.group_id }}
  enterprise_releases: >-
    {{ cloudsmith_repositories.enterprise.base_url }}/{{ cloudsmith_repositories.enterprise.repository }}/{{ cloudsmith_repositories.enterprise.group_id }}
  development_releases: >-
    {{ cloudsmith_repositories.enterprise.base_url }}/{{ cloudsmith_repositories.development.repository }}/{{ cloudsmith_repositories.enterprise.group_id }}

nexus_user: "{{ lookup('env', 'NEXUS_USERNAME') | default(null) }}"
nexus_password: "{{ lookup('env', 'NEXUS_PASSWORD') | default(null) }}"
cloudsmith_user: "{{ lookup('env', 'CLOUDSMITH_USERNAME') | default(null) }}"
cloudsmith_api_key: "{{ lookup('env', 'CLOUDSMITH_API_KEY') | default(null) }}"

artifact_servers:
  archive:
    releases: "{{ nexus_repository.releases }}"
    enterprise_releases: "{{ nexus_repository.enterprise_releases }}"
    username: "{{ nexus_user }}"
    password: "{{ nexus_password }}"
  cloudsmith:
    releases: "{{ cloudsmith_repository.releases }}"
    enterprise_releases: "{{ cloudsmith_repository.enterprise_releases }}"
    username: "{{ cloudsmith_user }}"
    password: "{{ cloudsmith_api_key }}"

# Last version of each release line published on the archive server: anything
# newer, or on a line not listed, is fetched from cloudsmith.
artifacts_archive_last_versions:
  repository: ["6.2.2.25", "7.4.2.6", "23.7.3", "25.5.2", "26.2.4"]
  community_repository: ["6.1.1", "7.4.2", "23.4.1", "25.3.0", "26.2.0"]
  api_explorer: ["1.4", "5.2.4", "6.3.0", "7.4.0", "23.7.0", "25.5.0", "26.2.0"]
  amp_googledrive_repo: ["3.4.2", "4.1.1", "5.0.0"]
  community_amp_googledrive_repo: ["3.4.2", "4.1.1", "5.0.0"]
  amp_googledrive_share: ["3.4.2", "4.1.1", "5.0.0"]
  amp_device_sync: ["2.2.3", "3.11.3", "4.0.1", "5.3.7"]
  amp_aos_module: ["1.6.3", "2.0.1", "3.4.3"]
  transformers_aio: ["2.6.0", "3.1.2", "4.0.1", "5.4.5"]
  transformers_pdf: ["0.10", "1.3.0-86"]
  trouter: ["0.5.2", "1.5.3", "2.1.2", "3.0.1", "4.4.5"]
  sfs: ["0.16.1", "1.5.3", "2.1.2", "3.0.1", "4.4.5"]
  search: ["1.4.3.4", "2.0.23"]
  search_enterprise: ["0.0.4", "3.3.3", "4.2.0", "5.9.0"]
  search_community: ["5.9.0"]
  acc: ["8.4.0", "10.5.0", "11.0.0"]
  adw: ["1.6", "2.9.1", "3.1.1", "4.4.1", "5.3.0", "6.0.0", "7.5.0", "8.0.0"]
  sync: ["3.11.3", "4.0.1", "5.3.7"]
  audit_storage: ["0.0.11", "1.3.5"]
  cic_connector: ["1.0.3"]

acs_play_java_core: "{{ acs_play_java_version.split('+')[0] }}"
acs_play_java_major: "{{ acs_play_java_core.split('.')[0] }}"
acs_play_default_truststore_type: "{{ 'PKCS12' if acs_play_java_major | int >= 21 else 'JCEKS' }}"

acs_play_repository_acs_edition: Enterprise

acs_play_skip_upgrade_checks: false

default_jdbc_pg_driver_version: 42.7.9
default_jdbc_pg_driver_base_url: https://repo.maven.apache.org/maven2/org/postgresql/postgresql
default_jdbc_pg_driver_url: >-
  {{ '{0}/{1}/postgresql-{1}.jar'.format(default_jdbc_pg_driver_base_url, default_jdbc_pg_driver_version) }}
default_jdbc_pg_driver_class: org.postgresql.Driver

acs_play_repo_db_url: ""
acs_play_repo_db_driver: "{{ default_jdbc_pg_driver_class }}"
acs_play_repo_db_name: "alfresco"
acs_play_repo_db_username: "alfresco"
acs_play_sync_db_url: ""
acs_play_sync_db_driver: "{{ default_jdbc_pg_driver_class }}"
acs_play_sync_db_name: "alfresco-sync"
acs_play_sync_db_username: "alfresco-sync"

# A default keystore is stored in /var/opt/alfresco/content-services/keystore,
# to replace this with a custom keystore place the keystore file in the "configuration_files/keystores" folder
# and change this flag to true. See the deployment guide for more details.
acs_play_repository_use_custom_keystores: false
acs_play_use_ssl: false
# Put your domain name here if any (e.g. ecm.alfresco.com).
# Needs to be empty if unused (don't use dummy values)
acs_play_fqdn_alfresco: ""

ansible_installation_status_file: "/opt/alfresco/.ansible_alfresco_components.status"
autogen_unsecure_secrets: false

# Community Edition vars
acs_play_community_repository_acs_artifact_name: alfresco-content-services-community-distribution
acs_play_community_repository_acs_server: "{{ acs_play_community_repository_acs_version | artifact_server(artifacts_archive_last_versions.community_repository) }}"
acs_play_community_repository_acs_repository: "{{ artifact_servers[acs_play_community_repository_acs_server].releases }}"
acs_play_community_repository_amp_googledrive_repo_artifact_name: alfresco-googledrive-repo-community
acs_play_community_repository_amp_googledrive_repo_server: "{{ acs_play_community_repository_amp_googledrive_repo_version | artifact_server(artifacts_archive_last_versions.community_amp_googledrive_repo) }}"
acs_play_community_repository_amp_googledrive_repo_repository: "{{ artifact_servers[acs_play_community_repository_amp_googledrive_repo_server].releases }}/integrations"

ports_cfg_postgres_sql: 5432

# Indexing artifact coordinates. Kept globally (rather than in per-group_vars) so they
# resolve for hosts in either the canonical (indexers/legacy_indexers) or the deprecated
# (search_enterprise/search) groups.
acs_play_search_enterprise_artifact_name: alfresco-elasticsearch-connector-distribution
acs_play_search_enterprise_server: "{{ acs_play_search_enterprise_version | artifact_server(artifacts_archive_last_versions.search_enterprise) }}"
acs_play_search_enterprise_repository: "{{ artifact_servers[acs_play_search_enterprise_server].enterprise_releases }}"
acs_play_search_enterprise_zip_url: "{{ acs_play_search_enterprise_repository }}/{{ acs_play_search_enterprise_artifact_name }}/{{ acs_play_search_enterprise_version }}/{{ acs_play_search_enterprise_artifact_name }}-{{ acs_play_search_enterprise_version }}.zip"
acs_play_search_enterprise_zip_checksum: "sha1:{{ acs_play_search_enterprise_zip_url }}.sha1"

acs_play_search_artifact_name: alfresco-search-services
acs_play_search_server: "{{ acs_play_search_version | artifact_server(artifacts_archive_last_versions.search) }}"
acs_play_search_repository: "{{ artifact_servers[acs_play_search_server].releases }}"
acs_play_search_zip_url: "{{ acs_play_search_repository }}/{{ acs_play_search_artifact_name }}/{{ acs_play_search_version }}/{{ acs_play_search_artifact_name }}-{{ acs_play_search_version }}.zip"
acs_play_search_zip_checksum: "sha1:{{ acs_play_search_zip_url }}.sha1"

acs_play_search_community_artifact_name: alfresco-elasticsearch-batch-indexing-distribution
acs_play_search_community_server: "{{ acs_play_search_community_version | artifact_server(artifacts_archive_last_versions.search_community) }}"
acs_play_search_community_repository: "{{ artifact_servers[acs_play_search_community_server].releases }}"
acs_play_search_community_zip_url: "{{ acs_play_search_community_repository }}/{{ acs_play_search_community_artifact_name }}/{{ acs_play_search_community_version }}/{{ acs_play_search_community_artifact_name }}-{{ acs_play_search_community_version }}.zip"
acs_play_search_community_zip_checksum: "sha1:{{ acs_play_search_community_zip_url }}.sha1"

# Backward-compatible resolution of indexing groups: canonical name unioned with the
# deprecated alias so playbooks work with either.
indexer_hosts: "{{ groups['indexers'] | default([]) | union(groups['search_enterprise'] | default([])) }}"
legacy_indexer_hosts: "{{ groups['legacy_indexers'] | default([]) | union(groups['search'] | default([])) }}"

# Elasticsearch indexing is supported on Enterprise (any version) or Community ACS 26.2+.
acs_play_elasticsearch_eligible: >-
  {{ (acs_is_enterprise or acs_play_repository_acs_version is version('26.2', 'ge')) | bool }}
acs_play_community_search_enabled: "{{ (acs_play_elasticsearch_eligible and not acs_is_enterprise) | bool }}"
acs_play_repository_index_type: >-
  {{ 'solr' if legacy_indexer_hosts | length > 0
     else ('elasticsearch' if (indexer_hosts | length > 0 and acs_play_elasticsearch_eligible)
     else 'noindex') }}
